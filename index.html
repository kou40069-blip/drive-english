<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ドライブ英会話パートナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Outfit:wght@500;700&display=swap">
<style>
  /* Layout: one column, phone first. The start button is huge so one tap before driving is enough. */
  :root {
    --bg: #eef3f4;
    --surface: #ffffff;
    --fg: #14262b;
    --muted: #5b6e73;
    --accent: #0f7c86;       /* Pacific teal */
    --accent-fg: #ffffff;
    --warm: #e2683c;          /* sunset, used only for the stop button */
    --line: #d3dee0;
    --font-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --font-en: "Outfit", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1a1d; --surface: #152629; --fg: #e4eef0; --muted: #93a8ad;
      --accent: #3fb4bd; --accent-fg: #06272a; --warm: #f08a62; --line: #24393d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1a1d; --surface: #152629; --fg: #e4eef0; --muted: #93a8ad;
    --accent: #3fb4bd; --accent-fg: #06272a; --warm: #f08a62; --line: #24393d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ja);
    font-size: 16px;
    line-height: 1.6;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    line-height: 1.3;
    text-wrap: balance;
  }
  h1 small {
    display: block;
    font-family: var(--font-en);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  button {
    font: inherit;
    border: 0;
    border-radius: 14px;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .start {
    width: 100%;
    min-height: 38vh;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 1.6rem;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .start span { font-size: 1rem; font-weight: 400; opacity: 0.9; }
  .start:disabled { opacity: 0.45; cursor: not-allowed; }
  .stop {
    width: 100%;
    min-height: 22vh;
    background: var(--warm);
    color: #fff;
    font-size: 1.5rem;
    font-weight: 700;
  }
  .status {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .status .label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .status .now { font-size: 1.25rem; font-weight: 700; }
  .status .scene { font-size: 0.95rem; color: var(--muted); }
  .log { display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .line .who { font-size: 0.75rem; color: var(--muted); }
  .line .text { font-family: var(--font-en); font-size: 1.05rem; overflow-wrap: anywhere; }
  .line.me .text { color: var(--accent); }
  .line.help .text { font-family: var(--font-ja); }
  .recap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .recap h2 { margin: 0; font-size: 1.1rem; }
  .recap ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 10px; }
  .recap .ja { font-size: 0.9rem; color: var(--muted); }
  .recap .en { font-family: var(--font-en); font-size: 1.1rem; }
  details.settings {
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  details.settings summary { cursor: pointer; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .field input, .field select {
    font: inherit;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    width: 100%;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .small-btn {
    padding: 10px 16px;
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--line);
  }
  .warn {
    background: var(--surface);
    border: 1px solid var(--warm);
    border-radius: 14px;
    padding: 14px 16px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .listening .now::after {
      content: " ●";
      color: var(--warm);
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Drive English Partner</small>ドライブ英会話パートナー</h1>
  </header>

  <div class="warn" id="noSupport" hidden>
    このブラウザでは声の聞き取りが使えません。iPhoneならSafari、AndroidならChromeで開いてください。
  </div>
  <div class="warn" id="noKey" hidden>
    はじめに、いちばん下の「設定」でAIのカギを入れてください。
  </div>

  <section id="idle">
    <button class="start" id="startBtn" type="button">
      おまかせ場面で始める
      <span>押したら、あとは声だけで進みます</span>
    </button>
  </section>

  <section id="running" hidden>
    <div class="status" id="statusBox">
      <span class="label">いまの状態</span>
      <span class="now" id="nowText">準備中…</span>
      <span class="scene" id="sceneText"></span>
    </div>
    <div style="height:16px"></div>
    <button class="stop" id="stopBtn" type="button">やめる</button>
  </section>

  <section class="recap" id="recap" hidden>
    <h2>今日言えなかった言い方</h2>
    <ol id="recapList"></ol>
  </section>

  <section class="log" id="log" aria-live="polite"></section>

  <details class="settings" id="settings">
    <summary>設定</summary>
    <div class="field">
      <label for="apiKey">AIのカギ（Anthropic APIキー）</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      <p class="muted">このスマホの中にだけ保存されます。</p>
    </div>
    <div class="row">
      <button class="small-btn" id="saveKey" type="button">保存する</button>
      <button class="small-btn" id="testVoice" type="button">声のテスト</button>
    </div>
    <p class="muted" id="settingsMsg" style="margin-top:10px"></p>
    <div class="field">
      <label for="voiceSelect">相手の声</label>
      <select id="voiceSelect"></select>
      <p class="muted">iPhoneの設定で「高品質」の声をダウンロードすると、ここに出てきて、より自然になります。</p>
    </div>
    <div class="row">
      <button class="small-btn" id="previewVoice" type="button">この声を聞く</button>
    </div>
  </details>
</div>

<script>
(() => {
  "use strict";

  // ---------- settings ----------
  const MODEL = "claude-haiku-5-5";
  const SESSION_MS = 10 * 60 * 1000;   // whole session incl. recap
  const WRAP_UP_MS = 7.5 * 60 * 1000;  // ask the partner to start closing the conversation
  const KEY_STORE = "dep.apiKey";
  const HISTORY_STORE = "dep.recapHistory";

  const SCENES = [
    { ja: "レストランの店員さん（注文）", en: "You are a friendly server at a casual restaurant in Honolulu. The user is a customer who just sat down. Take their order: greet, ask about drinks, food, and maybe a small follow-up question." },
    { ja: "カフェの店員さん", en: "You are a barista at a beach-side cafe in Waikiki. The user is at the counter. Take the order and make a little small talk." },
    { ja: "ホテルのフロント（チェックイン）", en: "You are a front desk clerk at a hotel in Waikiki. The user is checking in. Ask for their name, confirm the stay, and answer simple questions." },
    { ja: "お土産屋さんの店員さん", en: "You are a shop clerk at a souvenir shop in Honolulu. The user is browsing. Offer help, talk about items, sizes, and prices." },
    { ja: "タクシーの運転手さん", en: "You are a taxi driver in Honolulu. The user just got in. Ask where they are going and make friendly small talk on the way." },
    { ja: "ビーチで隣になった現地の人", en: "You are a local person relaxing at Ala Moana Beach. The user is sitting next to you. Start a casual chat: where they are from, what they like, recommendations." },
    { ja: "バスで隣の席になった現地の人", en: "You are a local passenger on a bus in Honolulu. The user sits next to you. Start a friendly conversation about their trip, hobbies, and the island." },
    { ja: "ツアーのガイドさん", en: "You are a tour guide on a small island tour. The user is a guest. Chat with them during a break: ask about their trip, food they tried, and their hobbies." },
  ];

  const $ = (id) => document.getElementById(id);
  const ui = {
    idle: $("idle"), running: $("running"), statusBox: $("statusBox"),
    now: $("nowText"), scene: $("sceneText"), log: $("log"),
    recap: $("recap"), recapList: $("recapList"),
    start: $("startBtn"), stop: $("stopBtn"),
    key: $("apiKey"), saveKey: $("saveKey"), testVoice: $("testVoice"),
    voiceSelect: $("voiceSelect"), previewVoice: $("previewVoice"),
    settings: $("settings"), settingsMsg: $("settingsMsg"),
    noSupport: $("noSupport"), noKey: $("noKey"),
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- voice output ----------
  const VOICE_STORE = "dep.enVoice";
  const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Fred|Good News|Jester|Junior|Kathy|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley/;

  // Higher is more natural: downloaded premium/enhanced voices first.
  function voiceRank(v) {
    const id = (v.voiceURI + " " + v.name).toLowerCase();
    if (id.includes("premium")) return 3;
    if (id.includes("enhanced") || id.includes("拡張")) return 2;
    if (/samantha|ava|zoe|google us|aria|jenny/.test(id)) return 1;
    return 0;
  }

  function englishVoices() {
    return speechSynthesis.getVoices()
      .filter((v) => v.lang.startsWith("en") && !NOVELTY.test(v.name))
      .sort((a, b) => voiceRank(b) - voiceRank(a) || (b.lang === "en-US") - (a.lang === "en-US"));
  }

  function pickVoice(lang) {
    const voices = speechSynthesis.getVoices();
    if (lang.startsWith("en")) {
      const saved = store.get(VOICE_STORE);
      return voices.find((v) => v.voiceURI === saved) || englishVoices()[0];
    }
    return voices
      .filter((v) => v.lang === lang || v.lang.startsWith(lang.slice(0, 2)))
      .sort((a, b) => voiceRank(b) - voiceRank(a))[0];
  }

  function fillVoiceSelect() {
    const list = englishVoices();
    if (!list.length) return;
    const current = pickVoice("en-US");
    ui.voiceSelect.replaceChildren(...list.map((v) => {
      const o = document.createElement("option");
      o.value = v.voiceURI;
      o.textContent = v.name + "（" + v.lang + "）" + (voiceRank(v) >= 2 ? " 高品質" : "");
      o.selected = current && v.voiceURI === current.voiceURI;
      return o;
    }));
  }

  // iOS Safari sometimes never fires onend, and drops utterances that get
  // garbage-collected mid-speech. Keep a reference and fall back to a timer
  // so the conversation never hangs.
  let currentUtterance = null;

  function speak(text, lang = "en-US", rate = 0.85) {
    return new Promise((resolve) => {
      if (!text) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = rate;
      const v = pickVoice(lang);
      if (v) u.voice = v;
      const perChar = lang.startsWith("ja") ? 160 : 75;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (currentUtterance === u) currentUtterance = null;
        resolve();
      };
      const timer = setTimeout(finish, 3000 + (text.length * perChar) / rate);
      u.onend = u.onerror = finish;
      currentUtterance = u;
      speechSynthesis.speak(u);
      // iOS can leave the engine paused after a cancel().
      if (speechSynthesis.paused) speechSynthesis.resume();
    });
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---------- voice input ----------
  let activeRec = null;

  // Resolves with what the user said, or "" when they stayed silent.
  function listen(lang = "en-US") {
    return new Promise((resolve) => {
      const rec = new Recognition();
      rec.lang = lang;
      rec.interimResults = false;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      let heard = "";
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(stopTimer);
        clearTimeout(hardTimer);
        if (activeRec === rec) activeRec = null;
        resolve(heard);
      };
      // Safety nets: iOS may keep listening forever or never fire onend.
      const stopTimer = setTimeout(() => { try { rec.stop(); } catch {} }, 15000);
      const hardTimer = setTimeout(finish, 18000);
      rec.onresult = (e) => {
        heard = Array.from(e.results).map((r) => r[0].transcript).join(" ").trim();
      };
      rec.onerror = () => {};
      rec.onend = finish;
      activeRec = rec;
      try { rec.start(); } catch { finish(); }
    });
  }

  // ---------- AI ----------
  async function askClaude(system, messages, maxTokens = 300) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": store.get(KEY_STORE) || "",
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system, messages }),
    });
    if (!res.ok) {
      const err = new Error("api");
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    return (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("").trim();
  }

  function parseJson(text) {
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) return null;
    try { return JSON.parse(m[0]); } catch { return null; }
  }

  function partnerSystem(scene, wrapUp) {
    return [
      "You are a conversation partner in a voice-only English speaking practice app.",
      "The user is Japanese, practicing while driving, and their English is about junior-high-school level.",
      "Scene: " + scene.en,
      "Rules:",
      "- Speak only English, using simple words a junior-high student knows. Keep each reply to 1-2 short sentences and end with an easy question, so the user speaks a lot.",
      "- Stay in character and keep the conversation natural.",
      "- If the user's message is [SILENT], they could not answer. Say the same thing again more slowly with simpler words, or offer two easy choices (for example: \"Coffee or tea?\").",
      "- If the user's English has a mistake, do not correct them. Just answer naturally, and use the correct form in your reply.",
      "- No emojis, no lists, no stage directions. Plain spoken sentences only.",
      wrapUp
        ? "- Time is almost up. Close the conversation naturally in this reply with a friendly goodbye, and set end to true."
        : "- Do not end the conversation yet; set end to false.",
      "Reply ONLY with JSON: {\"say\": \"what you say\", \"end\": false}",
    ].join("\n");
  }

  // ---------- session ----------
  let session = null;

  function setNow(text, listening = false) {
    ui.now.textContent = text;
    ui.statusBox.classList.toggle("listening", listening);
  }

  function addLine(kind, who, text) {
    const div = document.createElement("div");
    div.className = "line " + kind;
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = who;
    const t = document.createElement("span");
    t.className = "text";
    t.textContent = text;
    div.append(w, t);
    ui.log.append(div);
  }

  function isHelpWord(text) {
    return /^\s*(help|help me|helps|japanese|nihongo)[\s.!?]*$/i.test(text);
  }

  async function runHelp(s) {
    setNow("日本語でどうぞ");
    await speak("日本語でどうぞ。言いたいことを言ってください。", "ja-JP", 1.0);
    if (!s.alive) return null;
    setNow("聞いています（日本語）", true);
    const ja = await listen("ja-JP");
    if (!s.alive || !ja) return null;
    addLine("help help", "日本語で", ja);
    setNow("英語を考えています…");
    const lastPartner = [...s.messages].reverse().find((m) => m.role === "assistant");
    const out = await askClaude(
      "You help a Japanese learner (junior-high English level) say something in English during a conversation practice. " +
      "Give ONE short, natural, simple English sentence that means what they want to say, fitting the conversation. " +
      "Reply ONLY with JSON: {\"en\": \"...\"}",
      [{ role: "user", content: "Partner just said: " + (lastPartner ? JSON.parse(lastPartner.content).say : "") + "\nI want to say (Japanese): " + ja }],
      150,
    );
    const en = (parseJson(out) || {}).en;
    if (!en || !s.alive) return null;
    s.helped.push({ ja, en });
    addLine("help", "英語では", en);
    await speak("英語では、", "ja-JP", 1.0);
    await speak(en, "en-US", 0.75);
    await speak("言ってみましょう。", "ja-JP", 1.0);
    if (!s.alive) return null;
    setNow("聞いています", true);
    const tried = await listen("en-US");
    return tried || en;
  }

  async function runRecap(s) {
    setNow("今日のまとめを作っています…");
    const transcript = s.messages.slice(1).map((m) =>
      m.role === "assistant" ? "Partner: " + JSON.parse(m.content).say : "User: " + m.content
    ).join("\n");
    const helpedText = s.helped.map((h) => "- " + h.ja + " → " + h.en).join("\n") || "(none)";
    let items = [];
    try {
      const out = await askClaude(
        "You are an English coach for a Japanese learner (junior-high level) who practices speaking while driving. " +
        "From the conversation, pick up to 3 things the user could not say well: moments marked [SILENT], broken or very short answers, and phrases they asked for help with. " +
        "For each, give the Japanese meaning and one short, natural, simple English sentence they can use next time. " +
        "Reply ONLY with JSON: {\"items\": [{\"ja\": \"...\", \"en\": \"...\"}]}",
        [{ role: "user", content: "Scene: " + s.scene.en + "\n\nConversation:\n" + transcript + "\n\nHelp requests:\n" + helpedText }],
        500,
      );
      items = ((parseJson(out) || {}).items || []).filter((i) => i && i.ja && i.en).slice(0, 3);
    } catch {}

    ui.recapList.replaceChildren();
    items.forEach((i) => {
      const li = document.createElement("li");
      const ja = document.createElement("div"); ja.className = "ja"; ja.textContent = i.ja;
      const en = document.createElement("div"); en.className = "en"; en.textContent = i.en;
      li.append(ja, en);
      ui.recapList.append(li);
    });
    ui.recap.hidden = items.length === 0;

    if (items.length) {
      const history = JSON.parse(store.get(HISTORY_STORE) || "[]");
      history.push({ date: new Date().toISOString(), scene: s.scene.ja, items });
      store.set(HISTORY_STORE, JSON.stringify(history));
    }

    if (!s.alive) return;
    if (!items.length) {
      await speak("今日はよく話せました。お疲れさまでした。", "ja-JP", 1.0);
      return;
    }
    await speak("今日言えなかった言い方です。あとについて言ってみましょう。", "ja-JP", 1.0);
    for (const i of items) {
      if (!s.alive) return;
      setNow(i.ja);
      await speak(i.ja, "ja-JP", 1.0);
      await wait(300);
      await speak(i.en, "en-US", 0.75);
      await wait(3500); // time for the user to repeat aloud
      await speak(i.en, "en-US", 0.85);
      await wait(1500);
    }
    if (s.alive) await speak("お疲れさまでした。", "ja-JP", 1.0);
  }

  async function runSession() {
    const scene = SCENES[Math.floor(Math.random() * SCENES.length)];
    const s = { alive: true, scene, messages: [], helped: [], startedAt: Date.now() };
    session = s;

    ui.idle.hidden = true;
    ui.running.hidden = false;
    ui.recap.hidden = true;
    ui.log.replaceChildren();
    ui.scene.textContent = "今日の相手：" + scene.ja;

    try {
      await speak("今日の相手は、" + scene.ja + "です。", "ja-JP", 1.0);
      s.messages.push({ role: "user", content: "(The user has just arrived. Start the conversation.)" });
      let silentRow = 0;

      while (s.alive) {
        const elapsed = Date.now() - s.startedAt;
        setNow("相手が考えています…");
        const raw = await askClaude(partnerSystem(scene, elapsed > WRAP_UP_MS), s.messages);
        if (!s.alive) break;
        const reply = parseJson(raw) || { say: raw.replace(/[{}"]/g, ""), end: false };
        s.messages.push({ role: "assistant", content: JSON.stringify(reply) });
        addLine("them", scene.ja, reply.say);
        setNow("相手が話しています");
        await speak(reply.say, "en-US", 0.85);
        if (!s.alive || reply.end || Date.now() - s.startedAt > SESSION_MS - 60000) break;

        setNow("あなたの番です（聞いています）", true);
        let said = await listen("en-US");
        if (!s.alive) break;

        if (said && isHelpWord(said)) {
          said = (await runHelp(s)) || "";
          if (!s.alive) break;
        }

        if (!said) {
          silentRow++;
          // Two silences in a row: offer the Japanese help instead of repeating again.
          if (silentRow >= 2) {
            silentRow = 0;
            said = (await runHelp(s)) || "";
            if (!s.alive) break;
          }
        } else {
          silentRow = 0;
        }

        if (said) addLine("me", "あなた", said);
        s.messages.push({ role: "user", content: said || "[SILENT]" });
      }

      if (s.alive) await runRecap(s);
    } catch (e) {
      if (s.alive) {
        const msg = e && e.status === 401
          ? "AIのカギが正しくないようです。設定を確認してください。"
          : "通信がうまくいきませんでした。電波の良いところでもう一度試してください。";
        setNow(msg);
        await speak(msg, "ja-JP", 1.0);
      }
    }
    finish(s);
  }

  function finish(s) {
    s.alive = false;
    if (session === s) session = null;
    if (activeRec) { try { activeRec.abort(); } catch {} }
    speechSynthesis.cancel();
    releaseWake();
    ui.running.hidden = true;
    ui.idle.hidden = false;
  }

  // ---------- keep the screen awake while driving ----------
  let wakeLock = null;
  async function holdWake() {
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  }
  function releaseWake() {
    try { wakeLock?.release(); } catch {}
    wakeLock = null;
  }

  // ---------- wiring ----------
  function refreshGate() {
    const hasKey = !!store.get(KEY_STORE);
    ui.noSupport.hidden = !!Recognition;
    ui.noKey.hidden = hasKey || !Recognition;
    ui.start.disabled = !hasKey || !Recognition;
    if (!hasKey) ui.settings.open = true;
  }

  ui.start.addEventListener("click", () => {
    if (session) return;
    // runSession speaks its first line before any await, so the first
    // utterance comes from the tap itself, which iOS requires.
    runSession();
    holdWake();
  });

  ui.stop.addEventListener("click", () => {
    if (session) finish(session);
  });

  ui.saveKey.addEventListener("click", () => {
    const v = ui.key.value.trim();
    if (!v) { ui.settingsMsg.textContent = "カギが空です。"; return; }
    store.set(KEY_STORE, v);
    ui.key.value = "";
    ui.settingsMsg.textContent = "保存しました。";
    refreshGate();
  });

  ui.testVoice.addEventListener("click", async () => {
    if (!Recognition) { ui.settingsMsg.textContent = "このブラウザでは聞き取りが使えません。"; return; }
    ui.settingsMsg.textContent = "「Hello」と言ってみてください…";
    await speak("Say hello.", "en-US", 0.9);
    const heard = await listen("en-US");
    ui.settingsMsg.textContent = heard ? "聞こえました：「" + heard + "」" : "聞き取れませんでした。マイクの許可を確認してください。";
  });

  ui.voiceSelect.addEventListener("change", () => {
    store.set(VOICE_STORE, ui.voiceSelect.value);
  });

  ui.previewVoice.addEventListener("click", () => {
    speechSynthesis.cancel();
    speak("Hi! Welcome to Hawaii. What would you like to drink?", "en-US", 0.85);
  });

  if ("speechSynthesis" in window) {
    fillVoiceSelect();
    speechSynthesis.addEventListener("voiceschanged", fillVoiceSelect);
  }
  refreshGate();
})();
</script>
</body>
</html>
